// HSD telemetry -- CLIENT console. Copy to <game>/platform/cfg/user/ and run:  exec user/hsd_client
// platform/cfg/user/ is player-owned: the launcher never deletes it (launcher OverlayPaths.cs PlayerOwnedPrefixes,
// Host.Core/InstanceCfg.cs:4-6); other new files under platform/ may be swept by an update.
// Needs the client started with Developer (-dev -devsdk): bridge_move_trace and
// bridge_move_trace_replays are FCVAR_DEVELOPMENTONLY (s21-r5sdk/AGENTS.md:175-180).
// Observe-only. Nothing here changes movement.
bridge_move_trace 1
bridge_move_trace_replays 1
bridge_classvar_log_cl 1
hsd_md_enable 1
hsd_md_cl_trace 1
fps_max 144
// Keep 144 fps when the window is not in front (automated runs never focus it). Without this the
// client paced itself to ~19 fps unfocused (M1 session 1). The SDK demo player does the same
// (s21-r5sdk/src/engine/client/demo_play.cpp:831-836).
not_focus_sleep 0
echo "[HSD] client telemetry on: bridge_move_trace 1, hsd_md_cl_trace 1, fps_max 144, not_focus_sleep 0"
