// HSD telemetry -- DEDICATED SERVER console. Copy to <game>/platform/cfg/user/ and run:  exec user/hsd_dedi
// Needs the dedi started with Developer (-dev -devsdk). Observe-only.
// bridge_move_trace must have the same value on client and dedi for joinable logs
// (s21-r5sdk/src/game/server/move_sim_trace.cpp:42-45).
bridge_move_trace 1
bridge_classvar_log 1
hsd_md_enable 1
hsd_md_sv_trace 0
echo "[HSD] dedi telemetry on: bridge_move_trace 1"
