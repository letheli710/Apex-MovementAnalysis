// HSD trial labels -- CLIENT console. Copy to <game>/platform/cfg/user/ and run once:  exec user/hsd_runs
// Then type r<N> before a trial (sets hsd_md_run, which tags every [HSD-MD] client line;
// dedi [MOVE-TRACE] lines inherit the label through the command number) and r0 after it.
// 'alias' is a stock console command (it is on the SDK's script deny-list, vscript/script_convar_guard.cpp).
alias r0 "hsd_md_run 0; echo [HSD] run 0 (between trials)"
alias r1 "hsd_md_run 1; echo [HSD] run 1"
